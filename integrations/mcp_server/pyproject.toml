[project]
name = "research-brain-mcp"
version = "0.1.0"
description = "Optional read-only MCP adapter for a local research-brain vault"
requires-python = ">=3.11,<3.15"
dependencies = [
    "mcp==2.2.0",
    "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["research_brain_mcp"]
